name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-26.04
    steps:
      - name: Git checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm

      # The read-only gate: install from the lockfile, audit, version sync, format, lint, types, tests, build, manifest.
      - name: Check
        run: pnpm run check:raw

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ng-base
          path: dist/ng-base
