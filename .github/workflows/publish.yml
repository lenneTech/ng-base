name: Publish

# Release recipe: bump the version (root package.json, then `pnpm run version:sync`), commit, create the annotated tag
# `v<version>` and push it. This workflow then runs the full gate, publishes the built `dist/ng-base` to npm through
# Trusted Publishing (OIDC) with provenance, and creates the GitHub release from the CHANGELOG section of that version.
# `scripts/check-publish-workflow.mjs` (part of `check`) guards the publish steps.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-26.04
    steps:
      - name: Git checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
          # Writes the npm user config with a `${NODE_AUTH_TOKEN}` placeholder. setup-node v7 exports no dummy token any
          # more: the install in `Check` reads the placeholder unresolved (pnpm warns, public reads answer 200), and only
          # the publish step sets the token.
          registry-url: https://registry.npmjs.org

      - name: Tag matches version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}" >&2
            exit 1
          fi

      - name: Check
        run: pnpm run check:raw

      # Trusted Publishing needs npm >= 11.5.1. Pinned to the major lenneTech/cli publishes with through OIDC, not
      # `@latest`, so a new npm major never reaches a release run untried. npm 12 needs Node ^24.15.0.
      - name: npm for Trusted Publishing
        run: npm install -g npm@12

      # Trusted Publishing (OIDC, DEV-3143): npm exchanges this run's GitHub OIDC token (`id-token: write`) for a publish
      # token that lives for minutes. It needs the Trusted Publisher on npmjs.com: lenneTech / ng-base / publish.yml, no
      # environment; renaming this file breaks publishing until that entry is changed too. The step holds no token: the
      # empty NODE_AUTH_TOKEN lets a failed exchange stop with ENEEDAUTH before anything is signed or uploaded, instead of
      # sending the `${NODE_AUTH_TOKEN}` placeholder of the .npmrc. A version published here shows
      # `_npmUser.trustedPublisher` on the registry. `--ignore-scripts`: no lifecycle script runs in a publish step.
      - name: Publish to npm (Trusted Publishing)
        id: publish-oidc
        continue-on-error: true
        working-directory: dist/ng-base
        run: npm publish --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ''

      # Fallback until one release went out through OIDC (DEV-3143), then delete this step together with `id` and
      # `continue-on-error` of the step above (left alone, a failed publish would end the run green; the check fails
      # then). It runs only when the step above failed, for example while no Trusted Publisher is configured, and
      # publishes with NPM_TOKEN (still with provenance, signed with the same OIDC token).
      - name: Publish to npm (NPM_TOKEN fallback)
        if: steps.publish-oidc.outcome == 'failure'
        working-directory: dist/ng-base
        run: |
          echo "::warning title=Trusted Publishing::The OIDC publish failed, publishing with NPM_TOKEN (DEV-3143)"
          npm publish --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v version="$VERSION" '
            $0 ~ "^## \\[?" version "\\]?" { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          [ -s RELEASE_NOTES.md ] || echo "See CHANGELOG.md" > RELEASE_NOTES.md

      - name: GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
