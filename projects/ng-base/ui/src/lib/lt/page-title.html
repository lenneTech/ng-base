<div class="flex flex-wrap items-start justify-between gap-x-4 gap-y-3">
  <div class="flex min-w-0 flex-col gap-1">
    @switch (level()) {
      @case (1) {
        <h1 class="text-foreground text-2xl font-semibold tracking-tight text-balance">{{ title() }}</h1>
      }
      @case (2) {
        <h2 class="text-foreground text-xl font-semibold tracking-tight text-balance">{{ title() }}</h2>
      }
      @default {
        <h3 class="text-foreground text-lg font-semibold text-balance">{{ title() }}</h3>
      }
    }
    @if (description()) {
      <p class="text-muted-foreground text-sm text-pretty">{{ description() }}</p>
    }
  </div>
  <div class="flex flex-wrap items-center gap-2" [hidden]="!actions()">
    <ng-content select="[ltPageTitleActions]" />
  </div>
</div>
