<div hlmInputGroup [attr.data-disabled]="disabled() ? 'true' : null">
  <input
    #control
    hlmInputGroupInput
    autocapitalize="none"
    spellcheck="false"
    [id]="inputId()"
    [type]="visible() ? 'text' : 'password'"
    [attr.name]="name() || null"
    [attr.autocomplete]="autocomplete()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [required]="required()"
    [forceInvalid]="showInvalid()"
    [value]="value()"
    (input)="onInput($event)"
    (blur)="onBlur()"
  />
  <div hlmInputGroupAddon align="inline-end">
    <!-- hlmBtn (not hlmInputGroupButton): only hlmBtn forwards [disabled] to Spartan's button primitive. -->
    <button
      hlmBtn
      type="button"
      variant="ghost"
      size="icon-xs"
      class="shadow-none"
      [attr.aria-label]="visible() ? i18n.t('lt.ui.hidePassword') : i18n.t('lt.ui.showPassword')"
      [attr.aria-controls]="inputId()"
      [disabled]="disabled()"
      (click)="toggleVisibility()"
    >
      <ng-icon [name]="visible() ? 'lucideEyeOff' : 'lucideEye'" />
    </button>
  </div>
</div>
