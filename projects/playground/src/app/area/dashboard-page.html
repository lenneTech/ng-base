<section aria-labelledby="dashboard-title" class="grid gap-2">
  <h1 id="dashboard-title" class="text-2xl font-semibold">Übersicht</h1>
  @if (auth.user(); as user) {
    <p data-testid="dashboard-user">
      Angemeldet als <strong>{{ user.name || user.email }}</strong>
    </p>
    <p class="text-sm">
      E-Mail: <span data-testid="dashboard-email">{{ user.email }}</span>
    </p>
    <p class="text-muted-foreground text-sm">Rolle: {{ auth.isAdmin() ? 'Administrator' : 'Benutzer' }}</p>
  }
</section>

<section aria-labelledby="security-title" class="grid gap-6">
  <h2 id="security-title" class="text-xl font-semibold">Sicherheit</h2>
  <app-two-factor-settings />
  <app-passkey-settings />
  <app-password-settings />
</section>
