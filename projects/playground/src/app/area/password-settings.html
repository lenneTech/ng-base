<section aria-labelledby="password-title" class="grid gap-3 rounded-lg border p-4">
  <h3 id="password-title" class="font-semibold">Passwort ändern</h3>
  <form class="grid gap-3" [formRoot]="passwordForm">
    <lt-form-field for="password-current" label="Aktuelles Passwort" [error]="fieldError(passwordForm.currentPassword)">
      <lt-password-input id="password-current" autocomplete="current-password" [formField]="passwordForm.currentPassword" />
    </lt-form-field>
    <lt-form-field for="password-new" label="Neues Passwort" hint="Mindestens 8 Zeichen." [error]="fieldError(passwordForm.newPassword)">
      <lt-password-input id="password-new" autocomplete="new-password" [formField]="passwordForm.newPassword" />
    </lt-form-field>
    @if (changed()) {
      <lt-notice variant="success" title="Passwort geändert" data-testid="password-changed">Ab jetzt gilt das neue Passwort.</lt-notice>
    }
    @if (error(); as message) {
      <lt-notice variant="error" title="Passwort" data-testid="password-error">{{ message }}</lt-notice>
    }
    <button hlmBtn type="submit" class="justify-self-start" [disabled]="pending()">Passwort ändern</button>
  </form>
</section>
