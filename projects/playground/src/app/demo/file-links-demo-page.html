<main class="mx-auto grid w-full max-w-3xl gap-4 px-4 py-8">
  <h1 class="text-2xl font-semibold">Datei-Links</h1>
  <p class="text-muted-foreground text-sm">
    Bild und Download-Link kommen aus <code>LtFileService</code> und werden auf dem Server gerendert. Sie zeigen auf die öffentliche API-Adresse, nie auf die interne. Die Datei-ID
    ist ein Platzhalter.
  </p>
  <img class="size-16 rounded border" data-testid="file-image" alt="Beispielbild" [src]="files.getFileUrl(fileId)" />
  <a class="text-primary break-all underline underline-offset-4" data-testid="file-download" [href]="files.getDownloadUrl(fileId)">
    {{ files.getDownloadUrl(fileId) }}
  </a>
  <a routerLink="/" class="text-primary underline underline-offset-4">Zur Startseite</a>
</main>
